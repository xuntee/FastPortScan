name: Build & Release

# 推送 tag（如 v1.0.0）时自动编译 Windows x64 并创建 Release 附上 zip
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          python -m pip install ziglang
          python -m ziglang rc -c 65001 assets/app.rc app.res
          python -m ziglang c++ -target x86_64-windows-gnu -O2 -municode -static \
              -Wl,--subsystem,windows \
              src/main.cpp src/common.cpp src/scan.cpp src/config.cpp src/about.cpp \
              app.res -o FastPortScan.exe \
              -lws2_32 -lcomctl32 -liphlpapi -lgdi32 -lshell32

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path FastPortScan.exe `
            -DestinationPath "dist/FastPortScan-$($env:GITHUB_REF_NAME)-x64.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
