name: Build & Release

# 推送 tag（如 v1.0.3）时自动编译 Windows x64 并创建 Release
# 用 MSVC 编译（杀软对 MSVC 二进制的误报率远低于 zig/mingw 静态链接）
# 注意：每次发版前更新下面 body 里的修复说明
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          rc /nologo /c 65001 /fo app.res assets\app.rc
          cl /nologo /O2 /EHsc /MT /utf-8 /DUNICODE /D_UNICODE ^
             src\main.cpp src\common.cpp src\scan.cpp src\config.cpp src\about.cpp ^
             app.res ^
             /Fe:FastPortScan.exe ^
             /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup ^
             /MANIFEST:EMBED ^
             user32.lib gdi32.lib shell32.lib ws2_32.lib comctl32.lib iphlpapi.lib advapi32.lib

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path FastPortScan.exe `
            -DestinationPath "dist/FastPortScan-$($env:GITHUB_REF_NAME)-x64.zip"
          Copy-Item FastPortScan.exe "dist/FastPortScan-$($env:GITHUB_REF_NAME)-x64.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          body: |
            ## FastPortScan v1.0.5

            ### 本版修复
            - 扫描结果行的端口格式改为 `IP:端口`（冒号后不再带空格），复制出来的文本同步更新，
              如 `192.168.1.147:22`

            ### 历史修复（v1.0.3/v1.0.4）
            - 修复点击"开始扫描"后程序必然崩溃的问题（临界区未初始化）
            - 状态栏（进度 / 已完成 / 开放数 / 已用时间 / 预计剩余 / 总耗时）完整显示
            - 关于窗口背景色、确定按钮不再退出整个程序
            - 标题栏显示版本号；网卡下拉「IP 在前，网卡名在后」；冒号统一英文

            ### 使用
            下载 zip 解压或直接下载 exe 运行（x64，静态链接，单文件免安装）。
            程序图标/版本信息已内嵌，无需附带其他文件。
